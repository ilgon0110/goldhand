log_format goldhand_json escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"level":"info",'
        '"service":"nginx",'
        '"request_id":"$request_id",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time_seconds":$request_time,'
        '"upstream_response_time_seconds":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"user_agent":"$http_user_agent"'
    '}';

access_log /var/log/nginx/access.log goldhand_json;

server {
    listen 80;
    server_name nicegoldhand.com www.nicegoldhand.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://nicegoldhand.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.nicegoldhand.com;

    ssl_certificate /etc/letsencrypt/live/nicegoldhand.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nicegoldhand.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://nicegoldhand.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nicegoldhand.com;

    ssl_certificate /etc/letsencrypt/live/nicegoldhand.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nicegoldhand.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Reject common WordPress probes before they reach Next.js.
    location ~* ^/(?:wordpress(?:/|$)|wp-admin(?:/|$)|wp-content(?:/|$)|wp-includes(?:/|$)|wp-json(?:/|$)|wp-login\.php(?:/|$)|xmlrpc\.php(?:/|$)) {
        access_log off;
        return 404;
    }

    location = /_next/image {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header X-Request-ID $request_id always;
    }

    location /_next/ {
        proxy_pass http://nextjs:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Request-ID $request_id always;
    }

    location / {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
        add_header X-Request-ID $request_id always;
    }
}
