x-json-file-logging: &json-file-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - nextjs
    logging: *json-file-logging
    restart: unless-stopped

  nextjs:
    image: ${DOCKERHUB_USERNAME}/goldhand:${IMAGE_TAG:-latest}
    env_file:
      - .env.prod
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://host.docker.internal:4318/v1/traces
      OTEL_LOG_LEVEL: warn
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.namespace=goldhand,service.version=${IMAGE_TAG:-latest}
      OTEL_SERVICE_NAME: goldhand-nextjs
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
    extra_hosts:
      - host.docker.internal:host-gateway
    expose:
      - "3000"
    logging: *json-file-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
